# Managed-by: trancendos-governance-v1
name: CI Standard

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  governance-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required baseline files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f .github/CODEOWNERS
          test -f .github/dependabot.yml
          test -f .governance/standards.json
          test -f .governance/external-services.json
          test -f .governance/future-ready-2060.json
