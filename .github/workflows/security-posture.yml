# Managed-by: trancendos-governance-v1
name: Security Posture

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, GPL-2.0-only, GPL-3.0-only

  baseline-security-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify baseline governance files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f .github/CODEOWNERS
          test -f .github/dependabot.yml

  local-security-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dependency security checks when available
        if: hashFiles('package.json') != ''
        run: npm run security:deps --if-present

      - name: Validate governance documents when script is present
        if: hashFiles('scripts/security/validate-governance-documents.mjs') != ''
        run: node scripts/security/validate-governance-documents.mjs
